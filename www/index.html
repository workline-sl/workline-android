<style>
:root{--g1:#5B5BFF;--g2:#E23DC4;--bg:#EEF1FF;--card:#fff;--tx:#14183A;--mut:#4A5080;--ac:#5B5BFF;--ok:#0A7A4F;--line:#D9DEF5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g1:#9DB2FF;--g2:#FF8BE8;--bg:#0B0F24;--card:#161B3A;--tx:#EEF1FF;--mut:#A4AEDD;--ac:#8FA8FF;--ok:#6FF0B4;--line:#2A3160}}
:root[data-theme="dark"]{--g1:#9DB2FF;--g2:#FF8BE8;--bg:#0B0F24;--card:#161B3A;--tx:#EEF1FF;--mut:#A4AEDD;--ac:#8FA8FF;--ok:#6FF0B4;--line:#2A3160}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.5 'Noto Sans Sinhala','Noto Sans Tamil','Sora',sans-serif;max-width:480px;margin:0 auto;padding:16px 14px calc(110px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,select,textarea{font-size:16px!important}
select.in{-webkit-appearance:none;-moz-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 22px) 50%,calc(100% - 16px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px}
img{max-width:100%}
.chips,.stories,.gal,.seg,.cm,.sheet>div{-webkit-overflow-scrolling:touch}
h1{font:800 20px 'Sora';letter-spacing:.14em;margin:0}h1 b{color:#E8590C}
h2{font-size:18px;margin:18px 4px 10px}
.top{display:flex;justify-content:space-between;align-items:center;padding:0 4px}
#appb{width:40px;padding:0;justify-content:center;color:var(--ac)}
@media (max-width:420px){#acct .hbtn{display:none}.top .hbtn{min-height:38px}}  /* "Sign in" is also in the bottom bar */
.live{font:700 12px Sora;color:var(--ok)}
.in{width:100%;min-height:50px;padding:0 16px;border-radius:25px;border:1px solid var(--line);background:var(--card);outline-color:var(--ac)}
textarea.in{padding:12px 16px;min-height:90px;border-radius:20px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px;margin:10px 0}
.chip{flex:none;min-height:44px;padding:0 18px;border-radius:22px;background:var(--card);color:var(--tx);font-weight:600}
.chip.on,.pri{background:var(--ac);color:#fff}
.pri{min-height:50px;padding:0 22px;border-radius:25px;font-weight:700;width:100%}
.sec{min-height:50px;padding:0 22px;border-radius:25px;font-weight:700;background:var(--card);border:1px solid var(--line)}
.stories{display:flex;gap:12px;overflow-x:auto;padding:4px}
.av{position:relative;width:64px;height:64px;flex:none}
.av i{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:50%;background:#8B5CFF;background:conic-gradient(#22A6FF,#8B5CFF,#FF4FD8,#22A6FF);animation:rg 5s linear infinite}
.av span{position:absolute;top:4px;right:4px;bottom:4px;left:4px;border-radius:50%;border:3px solid var(--bg);display:flex;align-items:center;justify-content:center;font:700 22px 'Noto Sans Sinhala','Noto Sans Tamil';color:#fff;background:linear-gradient(135deg,#5B5BFF,#FF4FD8)}
.cap{position:relative;overflow:hidden;background:var(--card);border-radius:50px;box-shadow:0 12px 34px rgba(60,60,160,.16);margin-bottom:14px;animation:sl .6s ease-out both}
.cap.open{border-radius:36px}
.row{display:flex;align-items:center;gap:12px;min-height:100px;padding:10px 12px 10px 10px;cursor:pointer}
.row .av{width:80px;height:80px}.row .av span{font-size:28px}
.nm{font-weight:700;line-height:1.3}.sub{font-size:12px;color:var(--mut)}
.mid{flex:1;min-width:0}
.star{display:inline-block;color:#F5A300;animation:tw 1.8s ease-in-out infinite}
.call{width:54px;height:54px;border-radius:50%;background:#5B5BFF;color:#fff;display:flex;align-items:center;justify-content:center;flex:none;text-decoration:none;animation:pr 1.8s ease-out infinite}
.call svg{animation:bd 3s ease-in-out infinite}
.sh{position:absolute;top:0;bottom:0;width:60px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);animation:sh 3.6s ease-in-out infinite;pointer-events:none}
.more{padding:0 18px 16px;display:none;gap:8px;flex-direction:column}
.open .more{display:flex}
.more .kv{font-size:14px;color:var(--mut)}.more .kv b{color:var(--tx)}
.acts{display:flex;gap:8px;margin-top:6px}.acts button{flex:1;min-height:46px;border-radius:23px;font-weight:700;background:var(--bg);border:1px solid var(--line)}
.box{background:var(--card);border-radius:28px;padding:18px;margin-bottom:14px;box-shadow:0 12px 34px rgba(60,60,160,.12)}
label{display:block;font-weight:600;font-size:13px;margin:12px 4px 6px}
nav{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px))}
nav div{height:68px;border-radius:34px;background:var(--card);border:1px solid var(--line);box-shadow:0 10px 40px rgba(60,60,160,.25);display:flex;align-items:center;justify-content:space-around}
nav button{min-width:48px;padding:0 2px;min-height:52px;background:none;color:var(--mut);font-size:11px;font-weight:600}
nav button.on{color:var(--ac)}
nav .plus{width:56px;height:56px;min-width:56px;border-radius:50%;background:linear-gradient(135deg,#FF4FD8,#5B5BFF);color:#fff;font-size:30px;line-height:1;box-shadow:0 0 22px rgba(255,79,216,.5)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 20px;border-radius:24px;font-weight:600;font-size:14px;z-index:9;animation:sl .3s both}
.sheet{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(5,8,25,.55);z-index:8;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{width:100%;max-width:480px;max-height:92vh;max-height:92dvh;overflow:auto;overscroll-behavior:contain;background:var(--bg);border-radius:30px 30px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:sl .3s both}
.ring{display:block;margin:0 auto}
.tag{display:inline-block;padding:4px 12px;border-radius:14px;font-size:12px;font-weight:600;background:var(--bg);color:var(--ok)}
details{border-bottom:1px solid var(--line);padding:12px 4px}summary{font-weight:600;cursor:pointer;min-height:28px}
@keyframes rg{to{transform:rotate(360deg)}}
@keyframes pr{0%{box-shadow:0 0 0 0 rgba(91,91,255,.55)}100%{box-shadow:0 0 0 16px transparent}}
@keyframes tw{0%,100%{opacity:.4;transform:scale(.9)}50%{opacity:1;transform:scale(1.2)}}
@keyframes sh{0%{transform:translateX(-130%) skewX(-20deg)}60%,100%{transform:translateX(480%) skewX(-20deg)}}
@keyframes bd{0%,55%,100%{transform:rotate(0)}10%,30%{transform:rotate(-16deg)}20%,40%{transform:rotate(16deg)}}
@keyframes sl{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.pf{padding:0 0 90px}
.hd{margin:-18px -16px 0;padding:28px 16px 70px;background:linear-gradient(135deg,#5B5BFF,#FF4FD8);color:#fff;text-align:center;border-radius:30px 30px 0 0}
.pf .big{position:relative;width:112px;height:112px;margin:-56px auto 0}
.pf .big i{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:50%;background:#8B5CFF;background:conic-gradient(#22A6FF,#8B5CFF,#FF4FD8,#22A6FF);animation:rg 5s linear infinite}
.pf .big span{position:absolute;top:5px;right:5px;bottom:5px;left:5px;border-radius:50%;border:4px solid var(--bg);background:linear-gradient(135deg,#5B5BFF,#FF4FD8);color:#fff;display:flex;align-items:center;justify-content:center;font:700 40px 'Noto Sans Sinhala','Noto Sans Tamil'}
.st{display:flex;gap:8px;margin:14px 0}.st div{flex:1;background:var(--card);border-radius:20px;padding:12px 6px;text-align:center;font-size:12px;color:var(--mut)}.st b{display:block;font:800 18px Sora;color:var(--tx)}
.gal{display:flex;gap:8px;overflow-x:auto}.gal div{flex:none;width:120px;height:120px;border-radius:20px;background:linear-gradient(135deg,#C9D8FF,#FFD3EC)}
.fix{position:sticky;bottom:0;display:flex;gap:8px;padding:12px 0 0;background:var(--bg)}.chacts>*{min-width:0!important;padding-left:8px!important;padding-right:8px!important;white-space:nowrap}.fix a,.fix button{flex:1;min-width:0;padding:0 8px;white-space:nowrap;min-height:50px;border-radius:25px;font-weight:700;display:flex;align-items:center;justify-content:center;text-decoration:none}
.hint{font-size:12px;color:var(--mut);text-align:center;margin:0 0 10px}
.seg{display:flex;padding:4px;border-radius:24px;background:var(--card);gap:4px;margin:12px 0 4px;overflow-x:auto}.seg button{flex:1;min-height:46px;padding:0 12px;border-radius:20px;background:transparent;color:var(--mut);font-weight:600;font-size:13px;white-space:nowrap}.seg button.on{background:var(--ac);color:#fff}
.wrapc{display:flex;flex-wrap:wrap;gap:8px}.ck{position:relative;margin:0}.ck input{position:absolute;opacity:0;top:0;right:0;bottom:0;left:0}.ck span{display:inline-block;min-height:44px;line-height:44px;padding:0 16px;border-radius:22px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:13px}.ck input:checked+span{background:var(--ac);color:#fff}.ck input:focus-visible+span{outline:2px solid var(--ac)}
nav button.dn{position:relative}nav button.dn::after{content:"";position:absolute;top:6px;right:8px;width:8px;height:8px;border-radius:50%;background:#FF4F7B;animation:dt 1.4s infinite}
@keyframes dt{0%,100%{opacity:1}50%{opacity:.3}}
.tk{display:flex;gap:6px;margin-top:8px}.tk i{flex:1;height:6px;border-radius:3px;background:var(--line)}.tk i.on{background:#2FD48C}

 ගනුදෙනු, ගෙවීම්, ගිවිසුම්, වැඩ ගුණාත්මකභාවය, හානි, අලාභ, වංචා, සොරකම්, තුවාල හෝ ආරවුල් සඳහා Workline ආයතනික හෝ නීතිමය වගකීමක් නොදරයි. තීරණ ගැනීමට පෙර ඔබම තහවුරු කරගන්න.",en:"Workline is only a platform for sharing information and connecting people. Workline is not an employer, agent, guarantor or party to any contract. Workline accepts no corporate or legal liability for transactions, payments, agreements, work quality, damage, loss, fraud, theft, injury or disputes between users. Verify everything yourself before deciding."},TCB=[["වේදිකාව ගැන","About the platform","Workline මගින් පළ වන දැන්වීම් සහ ප්‍රොෆයිල් පරිශීලකයන් විසින් සපයන ඒවාය. ඒවායේ සත්‍යතාව සම්පූර්ණයෙන් සහතික කළ නොහැක.","Ads and profiles on Workline are provided by users. Their accuracy cannot be fully guaranteed."],["නිවැරදි තොරතුරු","Accurate information","සියලු තොරතුරු සත්‍ය හා යාවත්කාලීන විය යුතුය. පරිශීලකයන් වයස අවුරුදු 18ට වැඩි විය යුතුය. ව්‍යාජ තොරතුරු නිසා ගිණුම අත්හිටුවීමට හෝ ඉවත් කිරීමට අපට අයිතිය ඇත.","All information must be true and up to date. Users must be over 18. We may suspend or remove accounts for false information."],["සත්‍යාපන ලේඛන","Verification documents",'NIC, සෙල්ෆි, සහතික ආදිය තහවුරු කිරීමට පමණක් භාවිතා වේ; ප්‍රසිද්ධියට පළ නොකෙරේ. "සත්‍යාපිත" බැජ් එක ලේඛන සමාලෝචනයක් පමණි, ගුණාත්මකභාවයේ හෝ විශ්වාසවන්තභාවයේ සහතිකයක් නොවේ.','NIC, selfie, certificates etc. are used only for verification and are never published. The "verified" badge is only a document review, not a guarantee of quality or trustworthiness.'],["තහනම් අන්තර්ගත","Prohibited content","වංචනික, නීතිවිරෝධී, අසභ්‍ය, වෙනත් අයගේ ඡායාරූප හෝ ව්‍යාජ සහතික භාවිතය තහනම්ය.","Fraudulent, illegal or obscene content, other people's photos and fake certificates are prohibited."],["වාර්තා සහ අත්හිටුවීම","Reports & suspension","වාර්තා සමාලෝචනය කර අවශ්‍ය නම් දැන්වීම් ඉවත් කිරීමට හෝ ගිණුම් අත්හිටුවීමට හැක.","Reports are reviewed and ads may be removed or accounts suspended where needed."],["ආරවුල්","Disputes","ආරවුල් පාර්ශ්ව අතර විසඳා ගත යුතුය. අපි මැදිහත් වීමට උත්සාහ කළ හැකි නමුත් බැඳී නොසිටිමු. අදාළ ශ්‍රී ලංකා නීති අදාළ වේ.","Disputes must be settled between the parties. We may try to help but are not bound to. Applicable Sri Lankan law applies."],["සහාය දායකත්වය","Support contributions","ප්‍රොෆයිල් සහ රැකියා දැන්වීම් පළ කිරීම සැමවිටම නොමිලේ. වේදිකාවේ නඩත්තුවට ස්වේච්ඡා සහාය දායකත්වයක් (රු. 250 – 2,000) ලබා දිය හැකි අතර, ඒ වෙනුවෙන් ඔබේ දැන්වීම තෝරාගත් දින ගණන ලැයිස්තුවේ ඉහළින් පෙන්වයි. සත්‍යාපිත බැජ් එක, ඇගයීම් හෝ වෙනත් විශ්වාසනීයත්වයක් මුදලට ලබාගත නොහැක. ගෙවීම් අතින් පරීක්ෂා කර අනුමත කරයි. අනුමත වී ප්‍රවර්ධනය ආරම්භ වූ පසු සාමාන්‍යයෙන් ආපසු ගෙවීම් සිදු නොකෙරේ; වැරදි ගෙවීම් සඳහා සහාය අංශය අමතන්න.","Posting profiles and job ads is always free. You may make a voluntary support contribution (LKR 250 – 2,000) towards running the platform; in return your listing is shown at the top of the list for the chosen number of days. The verified badge, reviews or any other trust signal cannot be bought. Payments are checked and approved manually. Once approved and the boost has started, refunds are normally not given; contact support about mistaken payments."],["පෞද්ගලිකත්වය (PDPA)","Privacy (PDPA)","ඔබේ දත්ත භාවිතා වන්නේ සේවාව සැපයීමට, සත්‍යාපනයට සහ වංචා වැළැක්වීමට පමණි. ශ්‍රී ලංකාවේ පුද්ගලික දත්ත ආරක්ෂණ පනතට අනුව ඔබට දත්ත පිටපතක් ඉල්ලීමට හෝ ගිණුම සහ දත්ත මකා දැමීමට (මගේ → මගේ දත්ත) අයිතිය ඇත. ලේඛන සහ ගෙවීම් රිසිට්පත් පෞද්ගලික ගබඩාවක තබා පරිපාලකයන්ට පමණක් පෙන්වයි. ඔබ හෝ පරිපාලකයා යමක් මකා දැමූ විට එය වේදිකාවෙන් ඉවත් වී කිසිවෙකුට නොපෙනේ; නමුත් වංචා විමර්ශන, ආරවුල් සහ නීතිමය අවශ්‍යතා සඳහා එහි පිටපතක් සීමිත කාලයක් (සාමාන්‍යයෙන් අවුරුදු 5ක්) ආරක්ෂිත ලේඛනාගාරයක තබා, පසුව ස්වයංක්‍රීයව මකා දමනු ලැබේ. එය බැලිය හැක්කේ බලයලත් පරිපාලකයන්ට පමණි.","Your data is used only to provide the service, verify accounts and prevent fraud. Under Sri Lanka's Personal Data Protection Act you may request a copy of your data or delete your account and data (My account → My data). Documents and payment slips are kept in private storage visible only to administrators. When you or an administrator delete something, it is removed from the platform and nobody can see it; however a copy is kept in a secure archive for a limited period (normally 5 years) for fraud investigations, disputes and legal requirements, and is then deleted automatically. Only authorised administrators can access it."]],TCS={w:["වෘත්තිකයන් සඳහා","For professionals",[["ඔබේ සේවාව","Your service","ඔබ ලබාදෙන සේවාවේ ගුණාත්මකභාවයට, ආරක්ෂාවට සහ නීතිමය අවශ්‍යතාවලට (බලපත්‍ර, සුදුසුකම්) ඔබම වගකිව යුතුය.","You are responsible for the quality, safety and legal requirements (licences, qualifications) of the service you provide."],["ගාස්තු","Fees","ගාස්තුව, ද්‍රව්‍ය සහ ගමන් වියදම් වැඩට පෙර ගනුදෙනුකරු සමඟ ලිඛිතව එකඟ වන්න. ඉදිරිපත් මුදල් ඉල්ලීම් වංචාවක් ලෙස සැලකේ.","Agree the fee, materials and travel costs in writing with the customer before work. Asking for advance money is treated as fraud."],["වැඩ තත්ත්වය","Availability status",'"වැඩ භාරගත හැක / බැහැ" තත්ත්වය සත්‍ය ලෙස යාවත්කාලීන කරන්න.','Keep the "available / not available" status truthful and up to date.']]],pt:["පාර්ට් ටයිම් රැකියා දායකයන් සඳහා","For part-time employers",[["වැඩ සහ ගෙවීම","Work and payment","වැඩ ආරම්භයට පෙර වැටුප, පැය ගණන සහ ගෙවීම් දිනය පැහැදිලිව සඳහන් කරන්න. ගෙවීම් ප්‍රමාද නොකරන්න.","State the pay, hours and payment date clearly before work starts. Do not delay payments."],['"අද වැඩ" තත්ත්වය','"Work today" status','"අද වැඩ තියෙනවා / නැහැ" තත්ත්වය එදිනම යාවත්කාලීන කරන්න.','Update the "work available today" status on the same day.'],["තහනම්","Prohibited","රැකියාව සඳහා ලියාපදිංචි ගාස්තු, ඇපයක් හෝ ඉදිරිපත් මුදලක් අය කිරීම තහනම්ය.","Charging registration fees, deposits or advance payments for a job is prohibited."],["අඩු වයස","Under-age","අවුරුදු 18ට අඩු අයට රැකියා ලබාදීම තහනම්ය.","Offering jobs to people under 18 is prohibited."]]],ft:["ස්ථිර රැකියා දායකයන් සඳහා","For permanent-job employers",[["සේවා කොන්දේසි","Terms of employment","වැටුප, සේවා වේලාවන්, EPF/ETF ඇතුළු ශ්‍රමික නීතිවලට අනුකූල විය යුතුය. පත්වීම් ලිපියක් ලබා දිය යුතුය.","Pay, working hours, EPF/ETF and other labour laws must be followed. An appointment letter must be given."],["බඳවා ගැනීම","Recruitment","අයදුම්කරුවන්ගෙන් ගාස්තු අය කිරීම තහනම්ය. පෞද්ගලික ලේඛන ආරක්ෂා කළ යුතුය.","Charging applicants is prohibited. Personal documents must be kept safe."],["තත්ත්වය","Status",'"දැන් බඳවා ගන්නවා / අවසන්" තත්ත්වය සත්‍ය ලෙස පවත්වාගන්න.','Keep the "recruiting / closed" status truthful.']]],co:["ආයතනික බඳවා ගැනීම් සඳහා","For corporate recruitment",[["ආයතන සත්‍යාපනය","Company verification","BR සහතිකය, ලිපිනය සහ අධ්‍යක්ෂ තොරතුරු සත්‍ය විය යුතුය. ආයතන නාමය අනිසි ලෙස භාවිතය තහනම්ය.","BR certificate, address and director details must be genuine. Misusing a company name is prohibited."],["සමූහ බඳවා ගැනීම","Group recruitment","සම්මුඛ පරීක්ෂණ දිනය, ස්ථානය, අවශ්‍ය ලේඛන පැහැදිලිව සඳහන් කරන්න. පුරප්පාඩු අවසන් වූ විට වහාම වසන්න.","State the interview date, venue and required documents clearly. Close the ad immediately when vacancies are filled."],["ගාස්තු","Fees","සම්මුඛ පරීක්ෂණ, පුහුණු හෝ පත්වීම් සඳහා අයදුම්කරුවන්ගෙන් මුදල් ඉල්ලීම තහනම්ය.","Asking applicants for money for interviews, training or appointments is prohibited."]]],u:["ගනුදෙනුකරුවන් / අයදුම්කරුවන් සඳහා","For customers / applicants",[["තීරණ ඔබේම","Your own decisions","වෘත්තිකයෙකු/රැකියාවක් තෝරාගැනීමට පෙර ඇගයීම්, ලේඛන සහ යොමු බලන්න. පැමිණෙන්නා ප්‍රොෆයිලයට ගැළපේදැයි බලන්න.","Check reviews, documents and references before choosing a worker or job. Make sure the person who arrives matches the profile."],["මුදල් ආරක්ෂාව","Money safety","වැඩ අවසන් වන තුරු ඉදිරිපත් මුදල් ගෙවන්න එපා. OTP, බැංකු තොරතුරු කිසිවෙකුට නොදෙන්න.","Do not pay advance money before the work is done. Never share OTPs or bank details."],["ඇගයීම්","Reviews","ඇගයීම් දිය හැක්කේ සැබවින්ම වැඩ කළ අයට පමණි. ව්‍යාජ ඇගයීම් තහනම්ය.","Reviews may be given only by people who really worked with the person. Fake reviews are prohibited."]]]};function tcs(e){const a=TCS[e]||TCS.u;sheet(`<h2
