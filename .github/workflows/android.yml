name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Make the Android project
        run: |
          node scripts/prepare-www.js
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#0e1020' --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#0e1020'
          cp android-config/google-services.json android/app/google-services.json
          for d in resources/notif/drawable-*; do mkdir -p android/app/src/main/res/$(basename $d); cp $d/*.png android/app/src/main/res/$(basename $d)/; done
          node scripts/patch-android.js
          npx cap sync android

      - name: Build test APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk WORKLINE-test-${{ github.run_number }}.apk

      - name: Publish for download (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          name: WORKLINE test ${{ github.run_number }}
          prerelease: true
          body: Test build for phones (not for Play Store). Download the .apk on the phone and install.
          files: WORKLINE-test-${{ github.run_number }}.apk
